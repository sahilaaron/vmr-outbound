[project]
name = "vmr-outbound"
version = "0.0.1"
description = "VMR Outbound Agent — contact-first outbound campaign operating system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # 3.3.x returns text columns as bytes under some encodings and breaks the
    # SQLAlchemy psycopg dialect; pin to the verified 3.2.x line.
    "psycopg[binary]>=3.1,<3.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Operator workbench (server-rendered UI) and spreadsheet imports.
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    # Validates the Sales Navigator capture intake body against the extension's
    # committed contract schema (DAT-009). Draft 2020-12 validator.
    "jsonschema>=4.18",
    # RES-001 company research. Used only by the vendored website worker, and
    # only when the default-off company_research flag is on. Approved
    # 2026-07-29; the collector is fully offline-deterministic and needs no
    # API key. Playwright is deliberately NOT taken -- a JS-only site reports
    # insufficient evidence rather than escalating to a headless browser.
    "httpx>=0.27",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "trafilatura>=1.8,<3.0",
    "tldextract>=5.0,<6.0",
    "PyYAML>=6.0,<7.0",
    # Fernet envelope for Admin-managed verification-provider credentials.
    "cryptography>=42.0,<47.0",
    # Argon2id password hashing for hosted user accounts (#270). The reference
    # binding, maintained by the Python Cryptographic Authority, shipping wheels
    # for every platform this deployment uses so no C toolchain is needed at
    # install time. See `app/core/auth/passwords.py` for why Argon2id rather than
    # bcrypt or PBKDF2. No service, no key, no recurring cost.
    "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
# Vendored from the standalone company-website-researcher prototype (#173).
# Reformatting it in place would make re-vendoring an upstream fix a manual
# merge every time. Fix defects upstream and re-vendor instead.
extend-exclude = ["app/services/research/workers/_website"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom uses `Depends(...)` as an argument
# default, which B008 (function call in default argument) flags. This is the
# framework-sanctioned pattern, not a bug.
"app/api/routes.py" = ["B008"]
# Same FastAPI Depends(...) idiom on the workbench page routes.
"app/web/routes.py" = ["B008"]
# And on the redesigned Admin Workbench page routes.
"app/web/admin_workbench.py" = ["B008"]
# And on the customer-facing v2 page routes.
"app/web/v2/routes.py" = ["B008"]
# And on the Gmail mailbox authorization routes (#267).
"app/web/gmail_routes.py" = ["B008"]
# And on the Company Intelligence admin page routes (CI-001).
"app/web/company_intelligence.py" = ["B008"]
# And on the administrator's account-directory routes.
"app/web/v2/admin_users.py" = ["B008"]
# And on the sign-in routes, which now take a database session because both
# login paths resolve the caller against the `users` table.
"app/web/auth_routes.py" = ["B008"]
# The synthetic fixture literals (CSV text, sample rows) exceed the line limit
# by nature; wrapping them would corrupt the fixture content.
"app/services/devtools.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
warn_unused_ignores = true
disallow_untyped_defs = true
# Migrations are generated/imperative Alembic scripts; exclude from strict typing.
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

# Third-party collection libraries used only by the vendored research worker.
[[tool.mypy.overrides]]
module = ["trafilatura.*", "bs4.*", "tldextract.*", "lxml.*", "yaml.*"]
ignore_missing_imports = true

# The vendored collector itself. Same reasoning as the ruff exclusion above:
# it is upstream code, not code this repository writes. Everything that calls
# it -- app/services/research/*.py and workers/website.py -- stays strict, so
# the typed boundary is the wrapper, which is where it matters.
[[tool.mypy.overrides]]
module = ["app.services.research.workers._website.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]

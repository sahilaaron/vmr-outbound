# Installs to /etc/systemd/journald.conf.d/10-vmr.conf
# Bound persistent journal growth on the staging host.
#
# journald is the AUTHORITATIVE runtime log for vmr-web and vmr-worker; both
# units set StandardOutput=journal / StandardError=journal. /var/log/vmr exists
# only for file logs the application writes itself, so there is no duplicate
# logging system.
[Journal]
Storage=persistent
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=50M
MaxRetentionSec=30day

# TLS SERVER BLOCK - DOCUMENTED PLACEHOLDER, INTENTIONALLY COMMENTED OUT.
#
# It cannot be enabled yet: no DNS hostname is assigned and no certificate
# exists, and referencing absent ssl_certificate files makes `nginx -t` fail.
#
# When a DNS name is ready:
#   1. point the name at the VPS public IPv4
#   2. enable this site over HTTP first (ACME needs port 80 reachable)
#   3. certbot --nginx -d <name>       (installs certs and rewrites this block)
#   4. then enable the HTTPS redirect in the port-80 server above
#
# Note for step 3: certbot may add its own headers or a second
# client_max_body_size. Re-read the file afterwards and keep the values below.
#

# VMR staging site.
# Installs to /etc/nginx/sites-available/vmr-staging.conf
#
# STATUS: created DISABLED. Deliberately NOT symlinked into sites-enabled.
# Enabling it before a release is deployed publishes a 502. Enable with:
#     ln -s /etc/nginx/sites-available/vmr-staging.conf /etc/nginx/sites-enabled/
#     nginx -t && systemctl reload nginx
#
# REQUIRED companion files - `nginx -t` FAILS without all three:
#     /etc/nginx/conf.d/vmr-upgrade-map.conf      (from nginx/vmr-upgrade-map.conf)
#     /etc/nginx/snippets/vmr-proxy.conf          (from nginx/vmr-proxy.conf)
#     /etc/nginx/snippets/vmr-access.conf         (from nginx/vmr-access.conf.example)
#     /etc/nginx/snippets/vmr-probe-access.conf   (from nginx/vmr-probe-access.conf.example)
#
# THE ACCESS BOUNDARY IS THE POINT OF THIS FILE.
#
# The application has no authentication yet. Its route table on staging is 39
# documented operations, and they include unauthenticated state-changing calls:
# POST /api/campaigns, POST /api/campaigns/{id}/execution, PUT
# /api/agents/{id}/control, POST /api/agent-jobs/{id}/retry - and, because
# app/api/routes.py mounts an unprefixed router, root-level POST /campaigns as
# well. /docs, /redoc and /openapi.json are reachable too.
#
# So this site DEFAULT-DENIES. Only the ACME challenge path is public. Everything
# else - including the probes - goes through an access snippet that ships as
# `deny all;`. A path allow-list would have been the wrong shape: it would have
# missed root-level POST /campaigns, and it would silently fail to cover whatever
# the next merge adds.
#
# This is a boundary, not authentication. It is the interim measure until
# authenticated remote access exists; it is not a substitute for it, and no
# application auth is implemented in this branch.

upstream vmr_web {
    # The application binds to loopback only; nginx is the sole public entry.
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # REQUIRED DEPLOYMENT VARIABLE. The staging DNS name is not assigned yet and
    # is deliberately not invented here. Whatever goes here must match, exactly:
    #   * TRUSTED_HOSTS   in /etc/vmr/vmr.env
    #   * VMR_HEALTH_HOST in /etc/vmr/deploy.conf
    # A mismatch produces a blanket 400 "Invalid host header" from the
    # application that reads like an application fault. vmr-deploy cross-checks
    # the env file and refuses to run when they disagree.
    server_name REPLACE_WITH_STAGING_DNS_NAME;
    # NOTE: no "_" catch-all here - the distribution default site already claims
    # it, and two catch-alls produce "conflicting server name" with one silently
    # ignored. At enable time either set the real DNS name above, or disable the
    # default site (rm /etc/nginx/sites-enabled/default) to make this catch-all.

    # Do not advertise the nginx version.
    server_tokens off;

    # Request-body ceiling. Third of three, deliberately ordered:
    #   MAX_UPLOAD_BYTES   26214400 (25 MiB)  product ceiling
    #   MAX_REQUEST_BYTES  27262976 (26 MiB)  global declared ceiling, 1 MiB headroom
    #   client_max_body_size 28m   (29360128) here
    #
    # Sitting ABOVE the application ceiling is intentional: an oversized declared
    # body then reaches the app and the caller gets its structured JSON 413
    # rather than an nginx HTML error page - while nginx still backstops the one
    # case the application provably cannot bound, a body with no Content-Length
    # or chunked transfer encoding.
    client_max_body_size 28m;
    client_body_timeout  120s;
    client_header_timeout 30s;

    access_log /var/log/nginx/vmr-staging.access.log;
    error_log  /var/log/nginx/vmr-staging.error.log warn;

    # SECURITY HEADERS ARE NOT SET HERE, ON PURPOSE.
    #
    # The application's hardening middleware owns X-Content-Type-Options,
    # Referrer-Policy, X-Frame-Options, Permissions-Policy,
    # Content-Security-Policy, Cache-Control and Strict-Transport-Security, and
    # replaces any same-named header before the response leaves the app. nginx
    # `add_header` APPENDS, so anything set here arrives as a second, competing
    # value. Do not add a CSP, an HSTS header, or any other security header to
    # this file or to the TLS block below.

    # The only genuinely public path: ACME HTTP-01, so certbot can issue a
    # certificate before there is any reason to expose the application.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # --- HTTPS redirect: enable ONLY after a certificate exists ---
    # Leaving this commented means HTTP keeps working during bring-up.
    # location / { return 301 https://$host$request_uri; }

    # Deployment probes. Behind their own access snippet, which ships as
    # `deny all;`. Relax it ONLY if remote infrastructure monitoring genuinely
    # needs to reach them - the deployment health gate runs on this host against
    # 127.0.0.1 and does not need them published.
    #
    # /health and /ready are deliberately NOT proxied. They still exist in the
    # application as compatibility aliases, but /healthz and /readyz are the
    # authoritative contracts (docs/PRODUCTION_HARDENING.md), and proxying four
    # paths for two contracts is an invitation to point a monitor at the
    # deprecated pair. No repository contract requires the legacy paths at the
    # proxy.
    location = /healthz {
        include /etc/nginx/snippets/vmr-probe-access.conf;
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
        access_log off;
    }
    location = /readyz {
        include /etc/nginx/snippets/vmr-probe-access.conf;
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
        access_log off;
    }
    location = /version {
        include /etc/nginx/snippets/vmr-probe-access.conf;
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
        access_log off;
    }

    # The first-login password form. Identical proxying to `location /` in every
    # respect but one: this request is NOT written to the access log.
    #
    # Its one-time setup token travels in the query string, and nginx's default
    # `combined` format logs `$request` — the full request line, token included.
    # The application's own log records the matched route template and never the
    # query string, so without this block the reverse proxy would be the only
    # place a live, single-use, 24-hour password link was written down: readable
    # by anyone with access to the log file, its rotations, its backups or a log
    # shipper. Opening the page deliberately does not consume the token, so a
    # logged one is still usable — including for an administrator account.
    #
    # Losing these lines costs very little. A failed setup is still visible in
    # the application log by route and status, and the audit trail records every
    # link issued and every password set.
    location = /auth/setup {
        include /etc/nginx/snippets/vmr-access.conf;
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
        access_log off;
    }

    # Everything else: the operator UI (when it exists), the whole /api surface,
    # root-level POST /campaigns, /docs, /redoc, /openapi.json. Default-denied.
    location / {
        include /etc/nginx/snippets/vmr-access.conf;
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
    }
}


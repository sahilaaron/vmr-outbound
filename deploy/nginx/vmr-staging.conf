# VMR staging site.
# Installs to /etc/nginx/sites-available/vmr-staging.conf
#
# STATUS: created DISABLED. Deliberately NOT symlinked into sites-enabled.
# Enabling it before the application is deployed publishes a 502. Enable with:
#     ln -s /etc/nginx/sites-available/vmr-staging.conf /etc/nginx/sites-enabled/
#     nginx -t && systemctl reload nginx
#
# PLACEHOLDERS that MUST be confirmed before enabling:
#   * server_name        - a real DNS hostname is not yet assigned
#   * upstream port 8000 - must match APP_PORT in /etc/vmr/vmr.env
#   * the TLS block      - commented out until a certificate exists

upstream vmr_web {
    # The application binds to loopback only; nginx is the sole public entry.
    server 127.0.0.1:8000 fail_timeout=10s max_fails=3;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    # PLACEHOLDER: replace with the real DNS name once assigned.
    server_name REPLACE_WITH_REAL_DNS_NAME;
    # NOTE: no "_" catch-all here - the distribution default site already claims
    # it, and two catch-alls produce "conflicting server name" with one silently
    # ignored. At enable time either set the real DNS name above, or disable the
    # default site (rm /etc/nginx/sites-enabled/default) to make this catch-all.

    # Do not advertise the nginx version.
    server_tokens off;

    # Request-body ceiling. The application accepts spreadsheet uploads up to
    # MAX_UPLOAD_BYTES = 25 MB (app/core/config.py). 30m sits just above that so
    # a legitimate 25 MB import is never truncated at the proxy, while still
    # bounding the body - which matters because the Python layer cannot fully
    # bound a chunked request body itself. Keep in step with MAX_UPLOAD_BYTES.
    client_max_body_size 30m;
    client_body_timeout  120s;
    client_header_timeout 30s;

    access_log /var/log/nginx/vmr-staging.access.log;
    error_log  /var/log/nginx/vmr-staging.error.log warn;

    # ACME HTTP-01 challenge path, ready for certbot later.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # --- HTTPS redirect: enable ONLY after a certificate exists ---
    # Leaving this commented means HTTP keeps working during bring-up.
    # location / { return 301 https://$host$request_uri; }

    location / {
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
    }

    # Health and readiness endpoints.
    # NOTE: the path names below are UNCONFIRMED. The repository currently
    # documents /health (liveness) and /ready (readiness) in docs/DEVELOPMENT.md,
    # while the infrastructure brief specifies /healthz and /readyz. Both pairs
    # are proxied so whichever the application actually ships will work; delete
    # the pair that does not exist once confirmed.
    location = /healthz {
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
        access_log off;
    }
    location = /readyz {
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
        access_log off;
    }
    location = /health {
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
        access_log off;
    }
    location = /ready {
        include /etc/nginx/snippets/vmr-proxy.conf;
        proxy_pass http://vmr_web;
        access_log off;
    }
}

# ---------------------------------------------------------------------------
# TLS SERVER BLOCK - DOCUMENTED PLACEHOLDER, INTENTIONALLY COMMENTED OUT.

# Shared proxy parameters for the VMR web service.
# Installs to /etc/nginx/snippets/vmr-proxy.conf
# Included by the vmr-staging site. Not active on its own.
#
# THIS FILE SETS NO RESPONSE HEADERS AND NO SECURITY POLICY.
# The application's hardening middleware owns X-Content-Type-Options,
# Referrer-Policy, X-Frame-Options, Permissions-Policy, Content-Security-Policy,
# Cache-Control and Strict-Transport-Security, and strips any same-named header
# before the response leaves the app. nginx `add_header` appends rather than
# replaces, so anything added here would arrive as a second, competing value.
# One owner, no competition.

proxy_http_version 1.1;

# Forwarded identity. $proxy_add_x_forwarded_for appends nginx's view of the
# client to any existing chain.
#
# These headers are only honoured by the application when the immediate TCP peer
# is inside TRUSTED_PROXY_CIDRS - loopback, i.e. this nginx. Two things must stay
# aligned for that to be true:
#   * uvicorn runs with --no-proxy-headers (see deploy/systemd/vmr-web.service),
#     so uvicorn does not rewrite the peer address before the app's boundary sees
#     it;
#   * the application remains the only component interpreting X-Forwarded-*.
# If the VPS is ever placed behind an additional proxy or CDN, revisit these
# together with TRUSTED_PROXY_CIDRS - blindly trusting a client-supplied
# X-Forwarded-For is a spoofing vector.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket / connection upgrade passthrough (harmless if unused).
# Requires the map in conf.d/vmr-upgrade-map.conf.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Timeouts. proxy_read_timeout is deliberately 120s, NOT the usual 60s: the
# application's own contact-capture budget is 60s
# (contact_capture_intake_timeout_seconds in app/core/config.py), so a 60s proxy
# timeout would cut off a request the application still considers valid. 120s
# leaves headroom without letting genuinely hung requests accumulate.
proxy_connect_timeout 5s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

proxy_buffering on;
proxy_request_buffering on;

# VMR staging SSH hardening.
# Installs to /etc/ssh/sshd_config.d/10-vmr-hardening.conf
#
# Numbered 10- deliberately: sshd takes the FIRST value it sees for a keyword,
# and Include sits at line 12 of sshd_config. This file is therefore read before
# 50-cloud-init.conf (which sets PasswordAuthentication yes) and wins. Editing
# the main sshd_config instead would silently do nothing.
#
# Apply order that avoids lockout:
#   1. install this file
#   2. sshd -t                       (syntax)
#   3. sshd -T                       (confirm effective values BEFORE reload)
#   4. arm an auto-rollback, e.g.
#      systemd-run --on-active=5min --unit=vmr-ssh-rollback \
#        /bin/sh -c "mv -f <this file> /root/ && systemctl reload ssh"
#   5. systemctl reload ssh && systemctl restart ssh.socket
#   6. from a NEW connection prove key login works and password auth is refused
#   7. only then disarm: systemctl stop vmr-ssh-rollback.timer
#
# Note: sshd -T normalises 'prohibit-password' to the legacy synonym
# 'without-password', and prints one 'allowusers' line per user. Assertions
# written against the literal strings below will fail spuriously.

PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AllowUsers root sahil
MaxAuthTries 4
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# Deliberately NOT set: AllowTcpForwarding and PermitTTY are left at their
# defaults (yes) because VS Code Remote-SSH requires them.

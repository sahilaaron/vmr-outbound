<!DOCTYPE html>
<!--
  Visual preview harness for the side panel UI. It stubs the chrome.* messaging
  API with an in-page mock backed by the REAL shared modules and synthetic
  fixtures, then loads the REAL sidepanel scripts + stylesheet, so the rendered
  panel is exactly what ships. For screenshots / manual visual review only.

  Contact-first (DAT-013): the harness renders the results-page workflow with
  the shared labels/note and Save cards. There is no campaign anywhere.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=400, initial-scale=1.0" />
    <title>Side panel preview</title>
    <link rel="stylesheet" href="../src/sidepanel/sidepanel.css" />
    <style>body { max-width: 380px; }</style>
  </head>
  <body>
    <header class="app-header">
      <h1>VMR Contact Capture</h1>
      <p class="subtitle">Save the person first · decide what to do with them later</p>
    </header>
    <section class="card" id="migration-card" hidden>
      <span class="step-label">Workflow updated</span>
      <p class="small" id="migration-message"></p>
      <div class="row gap wrap">
        <button id="migration-export" class="btn" type="button" hidden>Download archived drafts</button>
        <button id="migration-dismiss" class="btn btn-ghost" type="button">Dismiss</button>
      </div>
    </section>
    <div id="salesnav-sections">
    <section class="card" id="detect-card">
      <div class="row space-between"><span class="step-label">1 · Page</span><button id="refresh-detect" class="btn btn-ghost" type="button">Refresh</button></div>
      <div id="detect-status" class="status status-neutral">Checking active tab…</div>
      <div id="detect-detail" class="muted small"></div>
    </section>
    <section class="card">
      <div class="row space-between"><span class="step-label">2 · Capture</span><span id="page-badge" class="badge badge-muted">page ?</span></div>
      <button id="capture-btn" class="btn btn-primary full" type="button" disabled>Capture visible contacts</button>
      <div id="capture-feedback" class="small muted"></div>
    </section>
    <section class="card">
      <div class="row space-between"><span class="step-label">3 · Review and exclude</span><button id="clear-btn" class="btn btn-ghost danger" type="button">Clear batch</button></div>
      <div id="summary" class="summary-grid"></div>
      <div class="row wrap gap" id="filter-row"><label class="checkbox small"><input type="checkbox" id="only-issues" /> Only contacts with warnings</label></div>
      <div id="records" class="records" aria-live="polite"></div>
    </section>
    </div>
    <section class="card" id="metadata-card">
      <div class="row space-between"><span class="step-label">Labels and note (optional)</span><button id="metadata-clear" class="btn btn-ghost" type="button">Clear</button></div>
      <div id="label-chips" class="warns" aria-live="polite"></div>
      <div class="row gap">
        <input id="label-input" class="input grow" type="text" maxlength="64" placeholder="Add a label and press Enter" list="label-suggestions" />
        <button id="label-add" class="btn btn-ghost" type="button">Add</button>
      </div>
      <datalist id="label-suggestions"></datalist>
      <label class="small muted" for="note-input">Note</label>
      <textarea id="note-input" class="input" rows="2" maxlength="2000"></textarea>
    </section>
    <section class="card" id="save-card">
      <span class="step-label">Save to VMR</span>
      <button id="save-btn" class="btn btn-primary full" type="button" disabled>Save Contact</button>
      <div id="save-state" class="send-state" aria-live="polite"></div>
      <div id="save-actions" class="row gap wrap"></div>
      <div class="row gap wrap" id="export-row"><button id="export-json" class="btn" type="button">Download JSON</button><button id="export-csv" class="btn" type="button">Download CSV</button></div>
    </section>
    <details class="card" id="settings" open>
      <summary class="step-label">Settings</summary>
      <label class="small muted" for="backend-url">Local backend base URL</label>
      <input id="backend-url" class="input" type="text" />
      <label class="small muted" for="mock-url">Mock receiver URL</label>
      <input id="mock-url" class="input" type="text" />
      <label class="small muted" for="send-target">Save target</label>
      <select id="send-target"><option value="mock">Mock receiver (test)</option><option value="backend">Local VMR backend</option></select>
      <label class="small muted" for="max-records">Max contacts per capture batch</label>
      <input id="max-records" class="input" type="number" min="1" max="500" />
      <button id="save-settings" class="btn btn-ghost" type="button">Save settings</button>
    </details>

    <script src="../src/common/constants.js"></script>
    <script src="../src/common/normalize.js"></script>
    <script src="../src/common/extraction.js"></script>
    <script src="../src/common/dedupe.js"></script>
    <script src="../src/common/schema.js"></script>
    <script src="../src/common/contact-schema.js"></script>
    <script src="../src/common/permissions.js"></script>
    <script src="../src/common/handoff.js"></script>
    <script>
      // ---- chrome.* stub backed by real modules + fixtures ----
      const { extraction, dedupe, constants } = self.SNCapture;
      const SUPPORTED = "https://www.linkedin.com/sales/search/people?keywords=head%20of%20operations&page=2";
      let BATCH = null;
      let METADATA = { labels: ["Healthcare"], note: "Met at SaaStr." };

      async function buildBatch() {
        const load = async (n) => {
          const html = await (await fetch("fixtures/" + n)).text();
          const doc = new DOMParser().parseFromString(html, "text/html");
          return extraction.extractPage(doc, { sourceSearchUrl: SUPPORTED, capturedAt: "2026-07-26T09:15:04.000Z" }).records;
        };
        const recs = dedupe.mergeBatch(await load("results-normal.html"), await load("results-duplicates.html")).records;
        BATCH = { clientSubmissionId: null, createdAt: "2026-07-26T09:15:04.000Z", lastSearchUrl: SUPPORTED, pagesCaptured: [2, 3], statuses: [], records: recs };
      }
      function view() {
        return { createdAt: BATCH.createdAt, lastSearchUrl: BATCH.lastSearchUrl, pagesCaptured: BATCH.pagesCaptured, statuses: [], summary: dedupe.summarize(BATCH.records), records: BATCH.records };
      }
      // Simulated optional-permission grant. window.__DENY_PERM__ forces the
      // denied path (for capturing the denied-state evidence screenshot).
      let permGranted = false;
      window.chrome = {
        permissions: {
          contains: () => Promise.resolve(permGranted),
          request: () => {
            if (window.__DENY_PERM__) return Promise.resolve(false);
            permGranted = true;
            return Promise.resolve(true);
          },
        },
        runtime: {
          lastError: undefined,
          sendMessage(msg, cb) {
            let resp = { ok: true };
            const included = BATCH.records.filter((r) => !r._excluded).length;
            switch (msg.type) {
              case "GET_STATE": resp = { ok: true, prefs: constants.DEFAULT_PREFERENCES, batchView: view(), metadata: METADATA, migration: { notice: null, hasArchive: false } }; break;
              case "DETECT_ACTIVE_PAGE": resp = { ok: true, page: { supported: true, challengeDetected: false, visibleCount: 5, url: SUPPORTED } }; break;
              case "CAPTURE_ACTIVE_PAGE": resp = { ok: true, captureStatus: constants.CAPTURE_STATUS.OK, added: 3, collapsed: 1, uncertain: 1, pageWarnings: [], batchView: view() }; break;
              case "TOGGLE_EXCLUDE": { const r = msg.stableKey ? BATCH.records.find(x => x._stableKey === msg.stableKey) : BATCH.records[msg.index]; if (r) r._excluded = !r._excluded; resp = { ok: true, batchView: view() }; break; }
              case "CLEAR_BATCH": BATCH.records = []; resp = { ok: true, batchView: view() }; break;
              case "SET_PREFS": resp = { ok: true, prefs: Object.assign({}, constants.DEFAULT_PREFERENCES, msg.prefs) }; break;
              case "GET_OPERATOR_METADATA": resp = { ok: true, metadata: METADATA }; break;
              case "SET_OPERATOR_METADATA": METADATA = Object.assign({}, METADATA, msg.metadata); resp = { ok: true, metadata: METADATA }; break;
              case "CLEAR_OPERATOR_METADATA": METADATA = { labels: [], note: null }; resp = { ok: true, metadata: METADATA }; break;
              case "FETCH_LABELS": resp = { ok: true, labels: ["Healthcare", "Venture Capital", "Conference Lead"] }; break;
              case "EXPORT_BATCH": resp = { ok: true, filename: "contact_capture.json", records: included }; break;
              case "SAVE_INCLUDED_CONTACTS": resp = { ok: true, status: 201, result: { submissionId: "sub_demo", alreadyReceived: false, counts: { submitted: included, created: 0, refreshed_exact_match: 1, staged_unmatched: included - 1, labels_applied: 1, notes_recorded: included }, results: [{ outcome: "refreshed_exact_match", captureUrl: "http://127.0.0.1:8000/contact-captures/cap_demo", contactUrl: "http://127.0.0.1:8000/contacts/con_demo" }], workbenchUrl: "http://127.0.0.1:8000/contact-captures/submissions/sub_demo" } }; break;
            }
            setTimeout(() => cb(resp), 0);
          },
        },
      };
      // Build the batch, THEN load the real sidepanel controller.
      buildBatch().then(() => {
        const s = document.createElement("script");
        s.src = "../src/sidepanel/sidepanel.js";
        document.body.appendChild(s);
        // sidepanel.js waits for DOMContentLoaded which already fired; nudge it.
        s.onload = () => document.dispatchEvent(new Event("DOMContentLoaded"));
      });
    </script>
  </body>
</html>

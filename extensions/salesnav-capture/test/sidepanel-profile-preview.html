<!DOCTYPE html>
<!--
  Visual preview harness for the PROFILE capture mode of the side panel
  (DAT-016 evidence).

  It loads the REAL sidepanel.html markup, the REAL stylesheet and the REAL
  panel scripts, and stubs only the chrome.* messaging API — backed by the REAL
  profile extractor running against the committed synthetic fixtures. So the
  rendered review card, and in particular the extraction warnings, are exactly
  what ships.

  Because the markup is fetched rather than copied, this harness cannot drift
  out of step with the panel it previews.

  Fixture is selected with ?fixture=<name>, defaulting to the placeholder
  headline case so the `placeholder_value` warning is visible.

  For screenshots / manual visual review only. Serve the extension directory
  over http (fetch cannot read file:// URLs):

      python3 -m http.server 8899
      open http://127.0.0.1:8899/test/sidepanel-profile-preview.html
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=400, initial-scale=1.0" />
    <title>Side panel preview — profile mode</title>
    <link rel="stylesheet" href="../src/sidepanel/sidepanel.css" />
    <style>body { max-width: 380px; }</style>
  </head>
  <body>
    <script>
      (async () => {
        const PANEL_DIR = "../src/sidepanel/";
        const params = new URLSearchParams(location.search);
        const FIXTURE = params.get("fixture") || "profile-placeholder-headline.html";
        const PROFILE_URL = "https://www.linkedin.com/in/preview-profile";

        // ---- 1. real markup ------------------------------------------------
        const panelHtml = await (await fetch(PANEL_DIR + "sidepanel.html")).text();
        const panelDoc = new DOMParser().parseFromString(panelHtml, "text/html");
        const scriptSrcs = Array.from(panelDoc.querySelectorAll("body script[src]")).map(
          (s) => s.getAttribute("src")
        );
        for (const s of Array.from(panelDoc.querySelectorAll("body script"))) s.remove();
        document.body.innerHTML = panelDoc.body.innerHTML;

        // ---- 2. real shared modules ----------------------------------------
        const load = (src) =>
          new Promise((resolve, reject) => {
            const s = document.createElement("script");
            s.src = src;
            s.onload = resolve;
            s.onerror = () => reject(new Error("failed to load " + src));
            document.body.appendChild(s);
          });

        const commonModules = scriptSrcs.filter((s) => s.includes("/common/"));
        for (const src of commonModules) await load(PANEL_DIR + src);
        await load("../src/common/extraction.js");
        await load("../src/common/surface.js");
        await load("../src/common/profile-extraction.js");

        // ---- 3. draft built by the real extractor --------------------------
        const { constants, profileExtraction } = self.SNCapture;
        const html = await (await fetch("fixtures-profile/" + FIXTURE)).text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        const ex = profileExtraction.extractProfile(doc, {
          sourceUrl: PROFILE_URL,
          capturedAt: "2026-07-26T10:00:00.000Z",
        });
        // Mirrors buildProfileDraftView() in the service worker.
        const DRAFT_VIEW = {
          clientCaptureId: "6f9619ff-8b86-d011-b42d-00cf4fc964ff",
          capturedAt: ex.capturedAt,
          status: ex.status,
          profile: ex.profile,
          experiences: ex.experiences || [],
          experienceCount: (ex.experiences || []).length,
          currentRoles: (ex.experiences || [])
            .filter((e) => e.is_current === true)
            .map((e) => ({ job_title: e.job_title, company_name: e.company_name })),
          missingSections: ex.missingSections || [],
          pageWarnings: ex.pageWarnings || [],
          excludedSections: [],
        };

        // ---- 4. chrome.* stub ----------------------------------------------
        const RESPONSES = {
          DETECT_SURFACE: {
            ok: true,
            surface: constants.SURFACES.PERSON_PROFILE,
            url: PROFILE_URL,
          },
          PROFILE_DETECT: {
            ok: true,
            page: { surface: constants.SURFACES.PERSON_PROFILE, experienceEntryCount: DRAFT_VIEW.experienceCount },
          },
          PROFILE_GET_STATE: {
            ok: true,
            prefs: constants.DEFAULT_PREFERENCES,
            metadata: { labels: [], note: "" },
            draftView: DRAFT_VIEW,
            lastResult: null,
          },
          PROFILE_MATCH_STATE: { ok: true, match: "none" },
          PROFILE_CAPTURE: { ok: true, draftView: DRAFT_VIEW },
          COMPANY_GET_STATE: { ok: true, draftView: null, lastResult: null },
          GET_STATE: { ok: true, prefs: constants.DEFAULT_PREFERENCES, batchView: null },
          FETCH_LABELS: { ok: true, labels: [] },
          SET_OPERATOR_METADATA: { ok: true, metadata: { labels: [], note: "" } },
        };

        window.chrome = {
          permissions: {
            contains: () => Promise.resolve(true),
            request: () => Promise.resolve(true),
          },
          runtime: {
            lastError: undefined,
            sendMessage(msg, cb) {
              setTimeout(() => cb(RESPONSES[msg.type] || { ok: true }), 0);
            },
          },
        };

        // ---- 5. real panel controllers -------------------------------------
        for (const src of scriptSrcs.filter((s) => !s.includes("/common/"))) {
          await load(PANEL_DIR + src);
        }
        document.dispatchEvent(new Event("DOMContentLoaded"));
      })();
    </script>
  </body>
</html>
